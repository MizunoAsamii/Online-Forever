name: Online Forever (Auto)

on:
  workflow_dispatch:
    inputs:
      auto:
        description: "Tự chạy lại sau mỗi lần (tick để bật)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: online-forever-auto
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bot
        timeout-minutes: 345
        continue-on-error: true
        run: python -u main.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
      - name: Chạy lại nếu bật auto
        if: ${{ !cancelled() && inputs.auto }}
        run: gh workflow run online-auto.yml -f auto=true
        env:
          GH_TOKEN: ${{ github.token }}
