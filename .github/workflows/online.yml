name: Online Forever (6 Hour)

on:
  workflow_dispatch:


concurrency:
  group: online-forever
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
